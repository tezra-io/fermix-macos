name: notarize

# Reusable signing + notarization workflow. The signing steps live here ONCE so a
# future macOS app under Apps/ calls this with its own package script instead of
# duplicating the flow. Gated by the protected `release-macos` environment (a
# required reviewer must approve before the Apple secrets are exposed).
#
# NOTE (hardening): actions are pinned to major-version tags to match the proven
# compux release flow. Pin to immutable commit SHAs for supply-chain hardening.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      package_script:
        required: false
        type: string
        default: scripts/package_release.sh
    secrets:
      MACOS_CERT_P12_BASE64:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
      MACOS_KEYCHAIN_PASSWORD:
        required: true
      MACOS_DEVELOPER_ID:
        required: true
      APPLE_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_APP_PASSWORD:
        required: true
      # The update feed's signing key. Required rather than optional: a release
      # that publishes no appcast item cannot be discovered by anyone who
      # already installed the app, and an optional secret is how that ships
      # unnoticed.
      SPARKLE_ED_PRIVATE_KEY:
        required: true
    outputs:
      dmg_name:
        value: ${{ jobs.notarize.outputs.dmg_name }}
      dmg_sha256:
        value: ${{ jobs.notarize.outputs.dmg_sha256 }}

permissions:
  contents: read

jobs:
  notarize:
    name: sign + notarize
    # The same toolchain the pull-request build uses (fermix-app.yml): the app
    # compiles against the macOS 26 SDK with the macOS 15 floor as its
    # deployment target, and the Xcode is pinned by path so a release is built
    # by a toolchain someone chose rather than the image's default of the day.
    runs-on: macos-26
    environment: release-macos
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      dmg_name: ${{ steps.out.outputs.dmg_name }}
      dmg_sha256: ${{ steps.out.outputs.dmg_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate signing secrets are complete
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for v in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_KEYCHAIN_PASSWORD \
                   MACOS_DEVELOPER_ID APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD \
                   SPARKLE_ED_PRIVATE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::signing is mandatory but these are unset:$missing"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: scripts/keychain.sh import

      # Packaging fetches the pinned engine and verifies its cosign signature
      # before staging it (scripts/verify_engine.sh), and the runner ships no
      # cosign. Installed unconditionally: a conditional install keyed on the
      # pin state would be a second path for a fact the packaging reads itself.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Build, sign, notarize + staple (DMG)
        env:
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PACKAGE_SCRIPT: ${{ inputs.package_script }}
        run: |
          set -euo pipefail
          "$PACKAGE_SCRIPT" "$VERSION" "$BUILD_NUMBER"

      - name: Gatekeeper quarantine-acceptance gate
        run: |
          set -euo pipefail
          dmg="$(ls dist/FermixPet-*.dmg)"
          # Simulate a browser download; a headless spctl otherwise never sees quarantine.
          xattr -w com.apple.quarantine "0081;$(date +%s);Safari;$(uuidgen)" "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"
          mp="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mp"
          spctl -a -t exec -vv "$mp/FermixPet.app"
          hdiutil detach "$mp"

      # The update feed's half of a release, written here because this is the
      # only job that may read the feed signing key and the only one holding the
      # stapled image together with the app inside it.
      #
      # The facts come from the mounted image rather than from the staging
      # directory on purpose: the versions, the engine build and the signing
      # authority the feed publishes are then the ones in the bytes people
      # download, not the ones a packaging step happened to stage. The key goes
      # from the environment straight into the script's standard input, so it is
      # never an argument, never a file, and never echoed.
      - name: Sign for Sparkle and write the appcast item
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source scripts/product_config.sh
          dmg="$(ls dist/FermixPet-*.dmg)"
          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          # Sparkle's tools come with the pinned binary target, so they live in
          # the release scratch path stage_app.sh builds into. appcast.py
          # refuses if the tool is not there rather than signing nothing.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | scripts/appcast.py item \
            --dmg "$dmg" \
            --app "$mount/$(product_config app_bundle_name)" \
            --tag "$REF_NAME" \
            --sign-update Apps/Fermix/.build-release/artifacts/sparkle/Sparkle/bin/sign_update \
            --out appcast-item.xml
          cat appcast-item.xml

      - name: Export artifact outputs
        id: out
        run: |
          set -euo pipefail
          dmg="$(ls dist/FermixPet-*.dmg)"
          echo "dmg_name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$(cat "$dmg.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: fermixpet-dmg
          path: |
            dist/FermixPet-*.dmg
            dist/FermixPet-*.dmg.sha256
          if-no-files-found: error

      # Its own artifact rather than a file added to the image's: the publish
      # job takes the item alone, and the two are produced by different steps
      # that fail for different reasons.
      - name: Upload appcast item artifact
        uses: actions/upload-artifact@v4
        with:
          name: fermixpet-appcast-item
          path: appcast-item.xml
          if-no-files-found: error
