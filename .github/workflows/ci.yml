name: ci

# The cask's ungated gate.
#
# release.yml renders Casks/fermix.rb.tmpl on a release tag and publishes the
# result to the tap. That template is checked in but never exercised outside a
# release, so a style regression in it would surface only after a full sign +
# notarize round trip. This renders it with a placeholder version and sha and
# lints it exactly as the release job does.
#
# Everything else about the application — build, unit tests, the XcodeGen spec,
# the product configuration and asset gates, the staging dry run, and the
# vendored wire contracts — lives in fermix-app.yml. The cask keeps its own file
# because it is the only gate that needs a Homebrew runner.
#
# No secrets: signing and notarization live in release.yml.
#
# Actions are pinned to immutable commit SHAs per M34 section 7.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  cask:
    name: Fermix cask (style)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cask style-check
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          sha="$(printf '%064d' 0)"
          sed -e "s/__VERSION__/0.0.0/g" -e "s/__SHA256__/$sha/g" \
            Casks/fermix.rb.tmpl > Casks/fermix.rb
          brew style Casks/fermix.rb
          rm -f Casks/fermix.rb
