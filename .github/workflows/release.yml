name: release

# Push a tag `vX.Y.Z` to cut a release: build universal2, Developer-ID sign,
# notarize + staple, DMG, then publish the DMG, its sha256, a keyless cosign
# signature and the release notes to download.fermix.ai, and a GitHub Release
# with the same files and the rendered Homebrew cask.
#
# Signing and publishing are gated by the protected `release-macos` environment
# (see notarize.yml).
# The `v*` tag namespace is maintainer-only via a protected-tag ruleset, and
# `--latest=false` keeps this off the repo-wide /releases/latest pointer.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: fermix-macos-release
  cancel-in-progress: false

jobs:
  version:
    name: resolve version
    # macOS like every other job in this workflow: Product.json is read through
    # scripts/product_config.sh, whose reader is plutil, so a Linux runner
    # cannot read the configuration this job compares the tag against. It used
    # to, and every lookup failed as a version mismatch that named the tag.
    runs-on: macos-15
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every rule about Product.json's own values, the positive-integer build
      # number among them, belongs to the product-configuration gate. Restating
      # one here gave the release path a second copy that could disagree with
      # the gate that PRs run. The tag comparison below is this workflow's own
      # question, because only a release knows what tag it was cut from.
      - name: Product configuration (single source of truth)
        run: scripts/check_product_config.sh

      # A release without notes is one nobody wrote down. The section is read
      # here, before anything is signed, so a tag cut without its changelog
      # entry fails in seconds rather than after notarization.
      - name: Release notes present (CHANGELOG.md)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/changelog_section.sh "${REF_NAME#v}" >/dev/null

      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          # Strict semver — reject anything the tag namespace shouldn't carry.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Bad tag::'$REF_NAME' is not vX.Y.Z"
            exit 1
          fi
          source scripts/product_config.sh
          [ "$version" = "$(product_config marketing_version)" ] || {
            echo "::error title=Version mismatch::The tag must match Product.json"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$(product_config build_number)" >> "$GITHUB_OUTPUT"

  notarize:
    name: sign + notarize
    needs: version
    uses: ./.github/workflows/notarize.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build_number: ${{ needs.version.outputs.build_number }}
    secrets: inherit

  # Signed once, in a job of its own: a keyless signature and its certificate
  # differ every time they are made, and download.fermix.ai takes each file
  # once. Re-running a failed publish job takes these same bytes from the
  # artifact, so the host accepts them as the files it already holds. Signed in
  # this workflow, not in notarize.yml, because the certificate names the
  # workflow that signed: release.yml is the identity people verify against.
  sign:
    name: cosign sign-blob (keyless)
    needs: notarize
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fermix-dmg
          path: dist

      - name: Verify DMG sha256 (from the uploaded bytes)
        env:
          EXPECTED: ${{ needs.notarize.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          dmg="$(ls dist/Fermix-*.dmg)"
          actual="$(sha256sum "$dmg" | awk '{print $1}')"
          echo "dmg=$dmg sha256=$actual"
          [ "$actual" = "$EXPECTED" ] || { echo "::error title=sha mismatch::$actual != $EXPECTED"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: cosign sign-blob (keyless)
        run: |
          set -euo pipefail
          dmg="$(ls dist/Fermix-*.dmg)"
          cosign sign-blob --yes \
            --output-signature "${dmg}.sig" \
            --output-certificate "${dmg}.pem" \
            "$dmg"

      - name: Upload the signature artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fermix-dmg-signature
          path: |
            dist/Fermix-*.dmg.sig
            dist/Fermix-*.dmg.pem
          if-no-files-found: error

  publish:
    name: publish release + cask
    needs: [version, notarize, sign]
    # Matches the notarize job's runner: see notarize.yml for why macos-15.
    runs-on: macos-15
    # The download host's write credentials live in the environment, which only
    # a job on a `v*` tag can enter.
    environment: release-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download DMG artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fermix-dmg
          path: dist

      - name: Verify DMG sha256 (from the uploaded bytes)
        env:
          EXPECTED: ${{ needs.notarize.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          dmg="$(ls dist/Fermix-*.dmg)"
          actual="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          echo "dmg=$dmg sha256=$actual"
          [ "$actual" = "$EXPECTED" ] || { echo "::error title=sha mismatch::$actual != $EXPECTED"; exit 1; }

      - name: Download the signature artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fermix-dmg-signature
          path: dist

      - name: Download appcast item artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fermix-appcast-item
          path: appcast

      # The feed is cumulative by contract: the app refuses an update unless the
      # feed also describes the build that is installed, so every earlier item
      # is carried forward from the last release's own asset. Running before the
      # release is created is what makes "the newest release that exists" the
      # previous one, and what stops a reused or decreasing build number from
      # publishing anything at all.
      - name: Merge the cumulative appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[].tagName | select(startswith("v"))] | first // ""')"
          merge=(--item appcast/appcast-item.xml --out appcast/appcast.xml)
          if [ -z "$previous" ]; then
            echo "::notice title=The feed starts here::no earlier app release exists, so this release is the whole feed"
          else
            # Listed, never attempted blind: a release cut before the feed
            # existed carries no appcast.xml, and that is a declared state
            # rather than a download whose failure gets read as "no updates".
            assets="$(gh release view "$previous" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$assets" | grep -qx appcast.xml; then
              mkdir -p previous
              gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
                --pattern appcast.xml --dir previous
              merge+=(--previous previous/appcast.xml)
            else
              echo "::notice title=The feed starts here::$previous publishes no appcast.xml, so this release is the whole feed"
            fi
          fi
          scripts/appcast.py merge "${merge[@]}"
          cat appcast/appcast.xml

      - name: Render the Homebrew cask from the DMG bytes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA256: ${{ needs.notarize.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__SHA256__/$SHA256/g" \
            Casks/fermix.rb.tmpl > Casks/fermix.rb
          cat Casks/fermix.rb

      - name: Style-check the cask
        run: brew style Casks/fermix.rb

      - name: Write the release notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/changelog_section.sh "${REF_NAME#v}" > dist/RELEASE_NOTES.md

      # Before the GitHub Release, so a refusal here leaves no release behind
      # and the cask smoke below installs from the address users download from.
      # Written once (scripts/publish_downloads.sh): re-running this failed job
      # sends the same artifacts' bytes again, which are accepted, while a full
      # re-run builds and signs a new DMG, which is refused.
      - name: Publish the files to download.fermix.ai
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dmg="$(ls dist/Fermix-*.dmg)"
          scripts/publish_downloads.sh "macos/$REF_NAME" \
            "$dmg" "$dmg.sha256" "$dmg.sig" "$dmg.pem" dist/RELEASE_NOTES.md

      - name: Create GitHub Release (not marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dmg="$(ls dist/Fermix-*.dmg)"
          gh release create "$REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$REF_NAME" \
            --latest=false \
            --notes-file dist/RELEASE_NOTES.md \
            "$dmg" "$dmg.sha256" "$dmg.sig" "$dmg.pem" Casks/fermix.rb

      # Both documents become assets of this release: the feed is what the site
      # serves, and the item is what the next release merges onto, so the next
      # release reads this one's own bytes instead of a copy kept somewhere
      # else. Publishing the feed is still a manual step, named here because a
      # feed that stays on the release reaches nobody.
      - name: Upload the appcast to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
            appcast/appcast.xml appcast/appcast-item.xml
          echo "::notice title=Publish the feed::copy this release's appcast.xml to fermix-site public/appcast.xml and deploy the site, otherwise installed clients see no update"

      # The real cask integrity gate: install from the cask exactly as a user
      # would, which exercises the download URL, the sha256 stanza, the DMG mount,
      # and the app copy. Runs AFTER the files are on download.fermix.ai (the
      # cask's url) and BEFORE the tap sees the cask — a failure here fails the
      # job and the cask never reaches the tap. Bounded retry covers CDN propagation.
      - name: Cask install smoke (from download.fermix.ai)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          # Homebrew rejects a loose cask file ("casks must be in a tap"), so stage
          # the rendered cask in a throwaway local tap and install from there —
          # exercising the real download URL, the sha256, the DMG mount, the app
          # copy, and Gatekeeper exactly as a user would. Install to a temp appdir,
          # not /Applications. Retry covers CDN propagation.
          tapdir="$(brew --repository)/Library/Taps/tezra-io/homebrew-casksmoke"
          brew tap-new tezra-io/casksmoke >/dev/null
          mkdir -p "$tapdir/Casks"
          cp Casks/fermix.rb "$tapdir/Casks/fermix.rb"
          git -C "$tapdir" add -A
          git -C "$tapdir" -c user.email=ci@local -c user.name=ci commit -q -m smoke

          appdir="$RUNNER_TEMP/casksmoke-apps"
          mkdir -p "$appdir"
          installed=""
          for attempt in 1 2 3; do
            if brew install --cask --appdir="$appdir" tezra-io/casksmoke/fermix; then
              installed=1
              break
            fi
            echo "install attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          [ -n "$installed" ] || { echo "::error title=Cask install smoke failed::cask does not install from download.fermix.ai"; exit 1; }
          test -d "$appdir/Fermix.app"
          spctl -a -t exec -vv "$appdir/Fermix.app"
          brew uninstall --cask --appdir="$appdir" tezra-io/casksmoke/fermix >/dev/null 2>&1 || true
          brew untap tezra-io/casksmoke >/dev/null 2>&1 || true

      # Tap publish is a PR, not a direct push: the tap's own review/CI is the
      # blocking gate, and a PR sidesteps the cross-repo push race with the CLI's
      # release workflow. Skipped (loudly) until HOMEBREW_TAP_TOKEN is configured.
      - name: Open a cask PR on the tap (if configured)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice title=Tap publish skipped::set HOMEBREW_TAP_TOKEN to auto-open a cask PR on tezra-io/homebrew-tap; the rendered cask is attached to the Release"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tezra-io/homebrew-tap.git" tap
          cd tap
          branch="fermix-cask-v${VERSION}"
          git checkout -b "$branch"
          mkdir -p Casks
          cp ../Casks/fermix.rb Casks/fermix.rb
          git add Casks/fermix.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fermix cask ${VERSION}"
          git push origin "$branch"
          GH_TOKEN="$TAP_TOKEN" gh pr create \
            --repo tezra-io/homebrew-tap \
            --head "$branch" \
            --title "fermix cask ${VERSION}" \
            --body "Notarized Fermix ${VERSION} cask, rendered from the release DMG bytes and install-smoked on the release runner."
