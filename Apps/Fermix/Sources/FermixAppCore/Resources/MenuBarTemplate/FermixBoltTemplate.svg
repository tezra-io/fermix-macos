<!--
  The Fermix bolt, menu bar template master.

  Geometry is the M33 redline verbatim: MenuBar.dc.html draws this exact path
  in a 24 unit viewBox at 16 by 16 points. Nothing here is redrawn.

  A template image carries shape, not color: macOS reads only the alpha
  channel and tints the result for the current menu bar appearance, which is
  why the fill is a flat black and there is no dark variant.

  scripts/build_menu_bar_template.py rasterizes this file into
  FermixBoltTemplate.png and FermixBoltTemplate@2x.png. Edit the path here,
  never the rasters.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none">
  <path d="M13 2 L4.5 13.5 H11 L10 22 L19.5 9.5 H13 Z" fill="currentColor"/>
</svg>
